<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <rect width="600" height="600" fill="#ffffff" rx="40"/>
  <!-- Small top fish -->
  <g transform="translate(300, 120) scale(0.45)">
    <polygon points="0,0 40,-40 80,0 40,40" fill="#0284c7"/>
    <polygon points="40,-40 80,-40 80,0" fill="#f59e0b"/>
    <polygon points="80,-40 120,0 80,0" fill="#0284c7"/>
    <polygon points="40,40 80,0 80,40" fill="#f59e0b"/>
  </g>
  <!-- Main large fish logo geometric triangles -->
  <g transform="translate(140, 180)">
    <polygon points="0,100 80,20 80,100" fill="#0284c7"/>
    <polygon points="0,100 80,100 80,180" fill="#0284c7"/>
    <polygon points="80,20 160,20 80,100" fill="#f59e0b"/>
    <polygon points="80,100 160,20 160,100" fill="#38bdf8"/>
    <polygon points="80,100 160,100 80,180" fill="#0284c7"/>
    <polygon points="80,180 160,100 160,180" fill="#0ea5e9"/>
    <polygon points="80,180 160,180 160,260" fill="#f59e0b"/>
    <polygon points="160,20 240,100 160,100" fill="#0284c7"/>
    <polygon points="160,100 240,100 240,180" fill="#ffffff"/>
    <polygon points="160,100 240,180 160,180" fill="#0284c7"/>
    <polygon points="240,100 320,100 240,180" fill="#0284c7"/>
  </g>
  <!-- Small bottom-right fish -->
  <g transform="translate(370, 310) scale(0.45)">
    <polygon points="0,0 40,-40 80,0 40,40" fill="#0284c7"/>
    <polygon points="40,-40 80,-40 80,0" fill="#38bdf8"/>
    <polygon points="80,-40 120,0 80,0" fill="#0284c7"/>
    <polygon points="40,40 80,0 80,40" fill="#f59e0b"/>
  </g>
  <!-- Text Brand -->
  <text x="300" y="490" font-family="'Noto Sans Thai', 'Sarabun', 'Prompt', sans-serif" font-size="44" font-weight="900" fill="#0f172a" text-anchor="middle" letter-spacing="1">ฟาร์มปลา</text>
  <text x="300" y="555" font-family="'Noto Sans Thai', 'Sarabun', 'Prompt', sans-serif" font-size="54" font-weight="900" fill="#0f172a" text-anchor="middle" letter-spacing="2">ผู้ใหญ่พร</text>
</svg>
